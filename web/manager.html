  // The actual log function
    //const _log = (...args) => console.log(`[DEBUG ${new Date().toISOString()}]:`, ...args);
    //const _log = (...args) => console.log(`[DEBUG] `,...args);
    const _log = (...args) => {
      const stack = new Error().stack;
      if (!stack) return console.log(...args);

      const lines = stack.split('\n');
      const callerLine = lines.find(l =>
        l !== "" &&
        !l.includes('_log') &&
        !l.includes('debug') &&
        !l.includes('Error')
      );
      const match = callerLine?.match(/^([^@]*)@.*:(\d+):\d+/);
      const rawTag = match ? `${match[1] || 'anon'}():${match[2]}` : "unknown";
      const MAX_WIDTH = 25;
      let formattedTag = rawTag.length > MAX_WIDTH
        ? ".." + rawTag.slice(-(MAX_WIDTH - 2))
        : rawTag.padEnd(MAX_WIDTH, ' ');

      console.log(`[${formattedTag}]:`, ...args);
    };

    const _nothing = () => { };

    let LOG = _nothing; // No Debug

    if (_DEBUG) {
      LOG = _log; // Debug
    }

  function init_collapsible() {
    var coll = document.getElementsByClassName("collapsible");
    var i;
    for(i = 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        //console.log(content);
        if(content.style.maxHeight) {
          content.style.maxHeight = null;
        } else {
          content.style.maxHeight = content.scrollHeight + "px";
        }
      });
    }

    document.getElementById("systembutton").dispatchEvent(new Event('click'));
    // disable the download log button on startup
    //disablebutton("downloadlog");
    //disabletoggle("logfile");
    //disabletoggle("seriallog");

    }

    //console.log("enable " + id);

  function tohex(value) {
    var rtn = parseInt(value).toString(16);
    if(rtn.length <= 1) return "0x0" + rtn;
    else return "0x" + rtn;
  }

  function todec(value) {
    let number = parseInt(value, 16);
    return number;
  }
  var _last_message_element = null;
  var _log_element_count = 0;
  const LOGS2DISPLAY = 500;
  var _log_div_pressed = -1;

  function show_error_in_log_console(message) {
    update_log_message("Error: (WebManager) - "+message);
  }

  function update_log_message(message) {
    //LOG("message='"+message+"'");
    if(_log_div_pressed == -1) {
      document.getElementById("logs").addEventListener("mousedown", function(e) {
        _log_div_pressed = true;
      })
      document.getElementById("logs").addEventListener("mouseup", function(e) {
        _log_div_pressed = false;
      })
      _log_div_pressed = false;
    }
    //console.log(message);
    var element = document.createElement("div");
    element.classList.add("logline");
    if(message.startsWith("Error")) {
      element.classList.add("logmsgerror");
    }
    if(message.startsWith("Warning")) {
      element.classList.add("logmsgwarning");
    }
    var logcontainer = document.getElementById("logs");
    if(_log_element_count >= LOGS2DISPLAY) {
      try {
        logcontainer.firstElementChild.remove();
      } catch (e) {
        _log_element_count++;
      }
    } else {
      _log_element_count++;
    }
    element.appendChild(document.createTextNode(message));
    logcontainer.appendChild(element);
    _last_message_element = element;
    if(_log_div_pressed == false) {
      logcontainer.scrollTop = logcontainer.scrollHeight - logcontainer.clientHeight;
    }
  }

  function showDoseHistory(data) {
  // Loop through each unique pump using the totals array
   update_log_message(" ");

   for (const total of data.totals) {
    const currentPump = total.pump_id;
  
    update_log_message(`======================= ${currentPump} Details =======================`);
  
    // 1. Filter and loop through matching history rows for this pump
    const pumpHistory = data.history.filter(item => item.pump_id === currentPump);
    for (const entry of pumpHistory) {
      update_log_message(` [${entry.timestamp}] Run time: ${entry.seconds}s | Sensor reading ${entry.reading.toFixed(2)} | Dosed: ${entry.ml.toFixed(2)} ml`);
    }
  
    update_log_message(`---------------------------------------------`);

    // --- NEW: Calculate True Time Span Covered By The Log ---
    let durationString = "0 hours";
    
    if (pumpHistory.length > 0) {
      // Clean up the double spacing in "Jun  9" so JavaScript Date can parse it reliably on all platforms
      const cleanTimestamps = pumpHistory.map(entry => {
        const sanitizedStr = entry.timestamp.replace(/\s+/g, ' ');
        return new Date(sanitizedStr).getTime();
      });

      // Find the absolute oldest entry in this batch
      const earliestTime = Math.min(...cleanTimestamps);
      const currentTime = Date.now(); // Current time on the controller dashboard
      
      // Calculate total time elapsed since tracking started
      const timeDeltaMs = currentTime - earliestTime;

      if (timeDeltaMs > 0) {
        const totalHours = Math.floor(timeDeltaMs / (1000 * 60 * 60));
        const days = Math.floor(totalHours / 24);
        const hours = totalHours % 24;

        if (days > 0) {
          durationString = `${days} day${days > 1 ? 's' : ''} ${hours} hour${hours !== 1 ? 's' : ''}`;
        } else {
          durationString = `${hours} hour${hours !== 1 ? 's' : ''}`;
        }
      }
    }

    // 2. Output the summary data
    update_log_message(`${currentPump} ${total.pump_name} TOTAL: ${total.sum_dose_ml.toFixed(2)}ml (${mlToGallons(total.sum_dose_ml).toFixed(2)}gal) over ${total.sum_runtime_s}s`);
    update_log_message(`Stats Window Tracking Covers: Last ${durationString}\n`);

    update_log_message(`============================================================`);
    update_log_message(" ");
   }
  }

  /**
 * Converts milliliters to US liquid gallons
 * @param {number} ml - The volume in milliliters
 * @returns {number} The volume in gallons
 */
function mlToGallons(ml) {
  const ML_PER_GALLON = 3785.41;
  return ml / ML_PER_GALLON;
}

  // Function to validate and display the JSON
  function webconfig_validateAndDisplay() {
    const jsonInput = document.getElementById('webconfig-json-input');
    const resultArea = document.getElementById('validation-result');
    const jsonString = jsonInput.value;
    // Clear previous results
    resultArea.className = '';
    resultArea.textContent = '';
    try {
      // Attempt to parse the string into a JavaScript object
      const jsonObject = JSON.parse(jsonString);
      // If parsing succeeds, format the JSON nicely (pretty print)
      const prettyJsonString = JSON.stringify(jsonObject, null, 2);
      addWebConfigLineNumber(prettyJsonString);
      // Update the text area with the pretty-printed JSON
      jsonInput.value = prettyJsonString;
      // Display success message
      resultArea.classList.add('valid_json');
      resultArea.textContent = 'JSON is VALID.';
      return true;
    } catch (error) {
      // If parsing fails, catch the error
      addWebConfigLineNumber(jsonString);
      // Display error message
      resultArea.classList.add('invalid_json');
      // The error object provides useful information about where the syntax error is
      resultArea.textContent = 'JSON is INVALID: ' + error.message;
    }
    return false;
  }

  function mergeMissingKeysRecursive(target, source) {
    // Ensure we are dealing with actual objects at this level
    if(typeof target !== 'object' || target === null || typeof source !== 'object' || source === null) {
      return target;
    }
    // Iterate over all keys in the source object
    for(const key in source) {
      if(Object.hasOwn(source, key)) {
        const sourceValue = source[key];
        const targetValue = target[key];
        // If the source value is a nested object and the target value is also 
        // a nested object (and not an array or null), recurse.
        if(typeof sourceValue === 'object' && sourceValue !== null && !Array.isArray(sourceValue) && typeof targetValue === 'object' && targetValue !== null && !Array.isArray(targetValue)) {
          // Recursively merge the nested objects
          target[key] = mergeMissingKeysRecursive(targetValue, sourceValue);
        } else if(targetValue === undefined) {
          // Otherwise, if the key is missing entirely in the target, add it
          target[key] = sourceValue;
          // console.log("Added missing key:", key);
        }
        // If the key already exists and is not an object pair ready for recursion, it is ignored (target takes precedence).
      }
    }
    return target;
  }

    if(u.substring(0, 5) == "https") {

function startWebsockets() {
  // 1. Clean up global timers to prevent racing conditions
  if (window.connTimeout) { clearTimeout(window.connTimeout); window.connTimeout = null; }
  if (window.reconnectTimer) { clearTimeout(window.reconnectTimer); window.reconnectTimer = null; }
  if (window.devicesInterval) { clearInterval(window.devicesInterval); window.devicesInterval = null; }

  if (_socket_di) {
    try {
      _socket_di.onopen = _socket_di.onmessage = _socket_di.onclose = _socket_di.onerror = null;
      _socket_di.close();
    } catch(e) { console.error("Error cleaning up old socket:", e); }
    _socket_di = null;
  }

  // Helper helper to handle scheduling the next reconnection safely
  const queueReconnect = () => {
    if (!window.reconnectTimer) {
      update_status_message('  !!! Connection error !!!  ', true);
      
      //LOG("Scheduling reconnection attempt in 5s...");
      window.reconnectTimer = setTimeout(() => {
        window.reconnectTimer = null;
        startWebsockets();
      }, 5000);
    }
  };

  try {
    const wsUrl = get_appropriate_ws_url();
    //LOG(`Attempting WebSocket connection to: ${wsUrl}`);
    
    _socket_di = new WebSocket(wsUrl);

    // 2. Set up the connection handshake timeout
    window.connTimeout = setTimeout(() => {
      if (_socket_di && _socket_di.readyState !== WebSocket.OPEN) {
        //LOG("Connection handshake timed out. Forcing close.");
        _socket_di.close();
      }
    }, 5000);

    // 3. Attach handlers immediately after construction
    _socket_di.onopen = function () {
      if (window.connTimeout) { clearTimeout(window.connTimeout); window.connTimeout = null; }
      //LOG("WebSocket Connected Successfully!");
      start_manager();
      update_status_message('');
    };

    _socket_di.onmessage = function got_packet(msg) {
      var data;
      try {
        data = JSON.parse(msg.data);
      } catch (error) {
        console.error("Failed to parse incoming JSON payload:", error);
        return;
      }
      
      if(data.logmsg) update_log_message(data.logmsg);
      else if(data.na_message) set_unavailable(data.na_message);
      else if(data.message) update_status_message(data.message);
      else if(data.type == 'acdmanager') { setAqManagerOptions(data); update_status(data); }
      else if(data.type == 'status') update_status(data);
      else if(data.type == 'config_schema') showConfig(data);
      else if(data.type == 'dose_history') showDoseHistory(data);
      else if(data.type == 'devices') update_devices(data);
      else if(data.type == 'instant_sensor_message') calibration(null, data);
      else if (isJsonErrorMessage(data)) {
        show_error_in_log_console("Received message '" + data.error + "' from server");
      }
    };

    _socket_di.onclose = function (event) {
      if (window.connTimeout) { clearTimeout(window.connTimeout); window.connTimeout = null; }
      //LOG(`WebSocket Closed. Code: ${event.code}, Reason: ${event.reason}`);
      _socket_di = null;
      queueReconnect();
    };

    _socket_di.onerror = function (err) {
      LOG("WebSocket Error observed.");
      // The browser automatically invokes onclose right after onerror, so let it handle it
    };

  } catch (err) {
    // This catches instant network/protocol failures or bad targets safely
    console.error("WebSocket constructor execution failed:", err);
    _socket_di = null;
    queueReconnect();
  }
}

  function isNewerVersion(version1, version2) {
    try {
      let [major1, minor1, patch1] = version1.split('.').map(Number => parseInt(Number, 10));
      let [major2, minor2, patch2] = version2.split('.').map(Number => parseInt(Number, 10));
      if(patch1 === undefined) {
        patch1 = 0;
      }
      if(patch2 === undefined) {
        patch2 = 0;
      }
      //console.log(version1+" major="+major1+", "+version2+" major="+major2);
      if(major1 > major2) return true;
      if(major1 < major2) return false;
      //console.log(version1+" minor="+minor1+", "+version2+" minor="+minor2);
      if(minor1 > minor2) return true;
      if(minor1 < minor2) return false;
      //Look for any strings that might be a pre-release
      if(version2.toLowerCase().includes("dev") || version2.toLowerCase().includes("dev") || version2.toLowerCase().includes("beta")) {
        patch2--;
      }
      //console.log(version1+" patch="+patch1+", "+version2+" patch="+patch2);
      return patch1 > patch2;
    } catch (e) {
      return false;
    }
  }

  function renderReleaseNotes(md) {
     md = md.replace(/<!--[\s\S]*?-->/g, '');   // remove comments (single or multi-line)
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const out = [];
      let inList = false;

      const closeList = () => {
        if (inList) { out.push('</ul>'); inList = false; }
      };

      for (const raw of md.split(/\r?\n/)) {
        const line = raw.trim();

        if (line === '') {                       // blank line
          closeList();
        } else if (/^-{2,}$/.test(line)) {       // -- or --- => horizontal rule
          closeList();
          out.push('<hr>');
        } else if (/^##\s+/.test(line)) {        // ## heading
          closeList();
          out.push(`<h3>${esc(line.replace(/^##\s+/, ''))}</h3>`);
        } else if (/^#\s+/.test(line)) {         // # title
          closeList();
          out.push(`<h2>${esc(line.replace(/^#\s+/, ''))}</h2>`);
        } else if (/^-\s+/.test(line)) {         // - bullet
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${esc(line.replace(/^-\s+/, ''))}</li>`);
        } else {                                 // anything else => paragraph
          closeList();
          out.push(`<p>${esc(line)}</p>`);
        }
      }
      closeList();
      return out.join('\n');
    }

  async function getVersions() {

    try {
      // Fetch the file from the specified path (make sure config.json exists)
      //const response = await fetch(VERSION_URL, {
      const response = await fetch(URLS[_name.toLowerCase()]["version"], {
        cache: 'no-store'
      });
      if(!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      // Get the response as plain text
      const versions = await response.text();
      const versionObject = JSON.parse(versions);
      for(const release of versionObject) {
        if(!release.assets || release.prerelease == "true" || release.assets.length === 0) {
          continue;
        }
        const downloadUrl = release.assets[0].browser_download_url;
        if(downloadUrl) {
          _aqualinkVersions[release.tag_name] = {};
          _aqualinkVersions[release.tag_name].url = downloadUrl;
          _aqualinkVersions[release.tag_name].prerelease = release.prerelease;
        }
      }
      populateVersionSelection();
    } catch (error) {
      console.error('There was a problem fetching the config file:', error);
      let dlg_msg = document.getElementById("alertDialogMessage");
      //dlg_msg.innerText = "Error connecting to github, please check connection!\n\n"+VERSION_URL;
      dlg_msg.innerHTML = '<p>Error connecting to github, please check connection</p<<hr><p style="font-size: small;">' + URLS[_name.toLowerCase()]["version"] + '</p>';
    }
  }

  async function getLatestVersion(tries = 0) {

      while (_name === undefined) {
        //LOG("getLatestVersion() name is blank, trying again...");
        await sleep(2000);
      }
      
      const targetUrl = URLS[_name.toLowerCase()]["version"] + "/latest";

      try {
        const response = await fetch(targetUrl);
        // Handles 200 OK
        if (response.ok) {
          const JS = await response.json();
          _latestVersionAvailable = JS.tag_name.replace(/[^\d.-]/g, '');
          document.getElementById("latestaquachemdversion").innerHTML = _latestVersionAvailable;
          return; // Success, exit function
        }

        // Handles 404 and other HTTP errors (e.g., 500, 403)
        if (response.status === 404) {
          console.log(`URL ERROR: ${response.status}`);
          if (tries >= 6) { // Try 6 times with 10 sec pause.  (so give up after 1 minute)
            show_error_in_log_console("Error getting latest version "+URLS[_name.toLowerCase()]["version"] + "/latest");
            return;
          }
          setTimeout(function () { getLatestVersion(++tries); }, 10000); // 10 seconds
          return;
        }

      } catch (error) {
        // 💥 CORS blocks, mixed-content errors, and network disconnects end up HERE
        //console.error("NETWORK/CORS ERROR DETECTED:", error);
        show_error_in_log_console("Network error getting latest "+_name+" version");
      }
  }

function renderConfigTable() {
    const table = document.getElementById('config_table');
    table.innerHTML = ''; // Clear existing table

    // --- Helper: Create a standard table row ---
    function createRow(indentLevel, labelText, inputElement, actionElement) {
        const tr = document.createElement('tr');
        
        const tdLabel = document.createElement('td');
        tdLabel.style.paddingLeft = `${indentLevel * 20}px`;
        tdLabel.style.fontWeight = indentLevel === 0 ? "bold" : "normal";
        tdLabel.textContent = labelText;
        
        const tdInput = document.createElement('td');
        if (inputElement) tdInput.appendChild(inputElement);
        
        const tdAction = document.createElement('td');
        tdAction.style.textAlign = "right";
        if (actionElement) tdAction.appendChild(actionElement);
        
        tr.appendChild(tdLabel);
        tr.appendChild(tdInput);
        tr.appendChild(tdAction);
        return tr;
    }

    // --- Helper: Sync typed values back to the JSON safely ---
    function updateFieldValue(field, rawValue) {
        if (field.type === 'number') {
            field.value = parseFloat(rawValue) || 0;
        } else if (field.type === 'boolean') {
            field.value = (rawValue === 'Yes' || rawValue === 'true');
        } else {
            field.value = rawValue;
        }
        console.log(`Updated ${field.key} to`, field.value); // Debug verification
    }

    // --- Helper: Build the correct HTML Input/Select ---
    function buildControl(field) {
        if (field.advanced) {
          if ( ! document.getElementById('show_advanced')?.checked) {
            return null;
          }
        }

        if (field.readonly) {
            const span = document.createElement('span');
            span.textContent = field.value;
            //span.style.fontSize = '0.65em'; // using "small" is another option.
            span.style.fontSize = 'small'; // using "small" is another option.
            return span;
        }

        let control;
        if (field.options && field.options.length > 0) {
            // Dropdowns for Selects and Booleans
            control = document.createElement('select');
            field.options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                // Handle Boolean matching ("Yes"/"No" to true/false)
                if (field.type === 'boolean') {
                    option.selected = (field.value === true && opt === 'Yes') || (field.value === false && opt === 'No');
                } else {
                    option.selected = (field.value === opt);
                }
                control.appendChild(option);
            });
        } else {
            // Standard Inputs for Text/Numbers
            control = document.createElement('input');
            control.type = field.type === 'number' ? 'number' : 'text';
            control.value = field.value;
        }

        // Bind changes directly to the _config field reference
        control.addEventListener('change', (e) => {
            updateFieldValue(field, e.target.value);
        });

        return control;
    }

    // ==========================================
    // RENDER GLOBAL FIELDS
    // ==========================================
    _config.fields.forEach((field) => {
        if (field.type === 'array_text') {
            // Array Header Row with Add Button
            const addBtn = document.createElement('button');
            addBtn.textContent = "+ Add Entry";
            addBtn.onclick = () => {
                field.value.push("new:value");
                renderConfigTable(); // Redraw to show new row
            };
            table.appendChild(createRow(0, field.key, null, addBtn));

            // Array Item Rows
            field.value.forEach((val, idx) => {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = val;
                input.addEventListener('change', (e) => {
                    field.value[idx] = e.target.value;
                    console.log(`Updated ${field.key}[${idx}] to`, field.value[idx]);
                });

                const delBtn = document.createElement('button');

                delBtn.onclick = () => {
                    field.value.splice(idx, 1);
                    renderConfigTable();
                };
                
                table.appendChild(createRow(1, `[${idx}]`, input, delBtn));
            });

        } else {
            // Standard Global Field
            const control = buildControl(field);
            if (control != null) table.appendChild(createRow(0, field.key, control, null));
        }
    });

   // ==========================================
    // RENDER CUSTOM BLOCKS
    // ==========================================
    // Visual Separator

    });

    const addBlockBtn = document.createElement('button');
    addBlockBtn.textContent = "Add Selected Driver";
    addBlockBtn.style.marginLeft = "10px";
    addBlockBtn.onclick = () => {
        const selectedId = parseInt(driverSelect.value);
        const template = _config.available_drivers.find(d => d.block_type_id === selectedId);
        
        if (template) {
            // Deep copy the template so we don't accidentally mutate available_drivers later
            const newBlock = {
                label: template.default_label,
                block_type_id: template.block_type_id,
                driver_type: template.driver_type,
                fields: JSON.parse(JSON.stringify(template.fields))
            };
            _config.custom_blocks.push(newBlock);
            renderConfigTable();
        }
    };

    tdAdd.appendChild(driverSelect);
    tdAdd.appendChild(addBlockBtn);
    addRow.appendChild(tdAdd);
    table.appendChild(addRow);
}

function update_ec_calibration_units(input) {
    const value = Number(input.value);
    const units = document.getElementById('cal_ec_units');

    units.textContent = Number.isFinite(value)
        ? (value === 0 ? ' (dry)' : ' µS')
        : '';
}

document.addEventListener('DOMContentLoaded', function() {
    update_ec_calibration_units(document.getElementById('cal_ec_val'));
});

</script>
